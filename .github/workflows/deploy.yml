name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Insert Google Maps key from repository secret
        env:
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_KEY" ]; then
            echo "::error::Repository secret GOOGLE_MAPS_KEY is not set"
            exit 1
          fi
          sed -i "s|PASTE_YOUR_GOOGLE_MAPS_KEY_HERE|${GOOGLE_MAPS_KEY}|" config.js
          grep -q "PASTE_YOUR_GOOGLE_MAPS_KEY_HERE" config.js && { echo "::error::Key was not inserted"; exit 1; } || true

      - name: Cache-bust local scripts and styles so every deploy loads fresh files
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(src|href)=\"(style\.css|config\.js|locations\.js|app\.js)\"#\1=\"\2?v=${v}\"#g" index.html
          grep -q "app.js?v=${v}" index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
